<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Sept 2026 (Henry): Music Lovers no longer has its own dedicated page
     — it's now a family card inside demo.html's "Try a Demo" picker,
     same as Real Estate and Ticketing (see that file's DEMOS array, id
     'henry-music-lovers'). This file is kept only as a redirect stub, so
     any already-printed QR code, bookmark, or shared link pointing here
     (and the Spotify OAuth callback's MUSIC_LOVERS_PAGE_URL, before that
     env var was updated — see websocketcalls' server.js) still lands
     somewhere useful instead of a dead page. Safe to delete outright once
     nothing external still points here. -->
<title>Redirecting… — Vonage AI Demos</title>
<script>
  // Carries through a ?spotify=... status param from the OAuth callback
  // (see server.js's /api/spotify-callback) so a visitor mid-flow still
  // lands with the right confirmation message on demo.html, instead of
  // that param being silently dropped by the redirect.
  var target = 'demo.html?demo=henry-music-lovers';
  var spotify = new URLSearchParams(window.location.search).get('spotify');
  if (spotify) target += '&spotify=' + encodeURIComponent(spotify);
  window.location.replace(target);
</script>
<meta http-equiv="refresh" content="0; url=demo.html?demo=henry-music-lovers">
</head>
<body>
<p>Music Lovers has moved — redirecting to <a href="demo.html?demo=henry-music-lovers">Try a Demo</a>.</p>
</body>
</html>
