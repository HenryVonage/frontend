<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSocket Calls</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 22px;
  }
  #status {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    background: #eee;
    color: #666;
  }
  #status.connected {
    background: #d4f4dd;
    color: #1a7a3c;
  }
  #status.disconnected {
    background: #fbdada;
    color: #a3222c;
  }
  #log {
    border: 1px solid #ddd;
    border-radius: 8px;
    height: 260px;
    overflow-y: auto;
    padding: 12px;
    margin: 16px 0;
    background: #fafafa;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 13px;
  }
  #log div {
    margin-bottom: 6px;
  }
  .sent { color: #0b5fff; }
  .received { color: #1a7a3c; }
  .system { color: #888; font-style: italic; }
  form {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<h1>WebSocket Calls <span id="status">connecting…</span></h1>

<div id="log"></div>

<form id="messageForm">
  <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off" disabled>
  <button type="submit" id="sendBtn" disabled>Send</button>
</form>

<script>
  // Update this to your Render service URL
  const WS_URL = 'wss://websocketcalls.onrender.com';

  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  const form = document.getElementById('messageForm');
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  function logMessage(text, cls) {
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(state, text) {
    statusEl.textContent = text;
    statusEl.className = state;
  }

  function connect() {
    setStatus('', 'connecting…');
    logMessage('Connecting to ' + WS_URL + ' …', 'system');

    const socket = new WebSocket(WS_URL);

    socket.onopen = () => {
      setStatus('connected', 'connected');
      logMessage('Connected.', 'system');
      input.disabled = false;
      sendBtn.disabled = false;
    };

    socket.onmessage = (event) => {
      logMessage('← ' + event.data, 'received');
    };

    socket.onerror = () => {
      logMessage('Connection error.', 'system');
    };

    socket.onclose = () => {
      setStatus('disconnected', 'disconnected');
      logMessage('Disconnected. Retrying in 3s…', 'system');
      input.disabled = true;
      sendBtn.disabled = true;
      setTimeout(connect, 3000);
    };

    form.onsubmit = (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg || socket.readyState !== WebSocket.OPEN) return;
      socket.send(msg);
      logMessage('→ ' + msg, 'sent');
      input.value = '';
    };
  }

  connect();
</script>

</body>
</html>
